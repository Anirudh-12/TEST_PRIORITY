name: Mine BugsInPy Dataset

on:
  workflow_dispatch:
    inputs:
      max_bugs:
        description: 'Maximum bugs to mine per project'
        required: true
        default: '10'

jobs:
  mine-dataset:
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    strategy:
      fail-fast: false
      matrix:
        project: 
          - httpie
          - thefuck
          - PySnooper
          - ansible
          - cookiecutter
          - keras
          - luigi
          - matplotlib
          - pandas
          - scrapy
          - spacy
          - tornado
          - youtube-dl
          - fastapi
          - sanic

    steps:
      - name: Pre-install System Dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y software-properties-common curl git build-essential tzdata

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Python Versions & uv
        run: |
          add-apt-repository ppa:deadsnakes/ppa -y
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y python3.6 python3.6-venv python3.6-dev \
            python3.7 python3.7-venv python3.7-dev \
            python3.8 python3.8-venv python3.8-dev \
            python3.9 python3.9-venv python3.9-dev \
            python3.10 python3.10-venv python3.10-dev
          curl -LsSf https://astral.sh/uv/install.sh | env UV_UNMANAGED_INSTALL="/usr/local/bin" sh

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -r requirements.txt

      - name: Run Data Collection
        env:
          BUGSINPY_WORKSPACE: ${{ github.workspace }}/bugsinpy_workspace
        run: |
          uv run python scripts/collect_dataset.py --only ${{ matrix.project }} --with-coverage --max-bugs ${{ github.event.inputs.max_bugs }}

      - name: Upload Processed Data
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: processed-data-${{ matrix.project }}
          path: data/processed/${{ matrix.project }}/
          retention-days: 7
