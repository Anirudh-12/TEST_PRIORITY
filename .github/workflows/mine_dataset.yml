name: Mine BugsInPy Dataset

on:
  workflow_dispatch:
    inputs:
      max_bugs:
        description: 'Maximum bugs to mine per project'
        required: true
        default: '10'

jobs:
  build-env:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t tp-env .

      - name: Save Docker Image
        run: docker save tp-env -o tp-env.tar

      - name: Upload Docker Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: tp-env.tar
          retention-days: 1

  mine-dataset:
    needs: build-env
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: 
          - httpie
          - thefuck
          - PySnooper
          - ansible
          - cookiecutter
          - keras
          - luigi
          - matplotlib
          - pandas
          - scrapy
          - spacy
          - tornado
          - youtube-dl
          - fastapi
          - sanic

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Docker Image Artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker Image
        run: docker load -i tp-env.tar

      - name: Run Data Collection
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            tp-env \
            bash -c "uv venv && uv pip install -r requirements.txt && uv run python scripts/collect_dataset.py --only ${{ matrix.project }} --with-coverage --max-bugs ${{ github.event.inputs.max_bugs }}"

      - name: Upload Processed Data
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: processed-data-${{ matrix.project }}
          path: data/processed/${{ matrix.project }}/
          retention-days: 7
